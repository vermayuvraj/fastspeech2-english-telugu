name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install experiment dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test, lint and compile
        run: python scripts/run_checks.py
